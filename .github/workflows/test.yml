name: "Nix Configuration"
on:
  pull_request:
  push:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: cachix/install-nix-action@v31.10.6
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          extra_nix_config: |
            experimental-features = nix-command flakes
      - uses: DeterminateSystems/magic-nix-cache-action@v13
      - name: Script syntax
        run: bash -n scripts/*.sh
      - name: Nix lint
        run: nix develop --command lint-nix
      - name: Dead Nix code
        run: nix develop --command lint-deadnix
      - name: Nix formatting
        run: nix develop --command ci-format-nix
      - name: Lua lint
        run: nix develop --command lint-lua
      - name: Lua formatting
        run: nix develop --command lua-format --check --config=./codestyle/lua-format-config.yml ./home-configs/hammerspoon

  eval:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: cachix/install-nix-action@v31.10.6
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          extra_nix_config: |
            experimental-features = nix-command flakes
      - uses: DeterminateSystems/magic-nix-cache-action@v13

      - name: Flake check
        run: nix flake check --no-build --show-trace --all-systems

      - name: Darwin dry-runs
        run: |
          for host_dir in hosts/*/darwin.nix; do
            host=$(basename "$(dirname "$host_dir")")
            nix build --dry-run ".#darwinConfigurations.${host}.system"
          done

      - name: NixOS dry-runs
        run: |
          for host_dir in hosts/*/nixos.nix; do
            host=$(basename "$(dirname "$host_dir")")
            nix build --dry-run ".#nixosConfigurations.${host}.config.system.build.toplevel"
          done

      - name: Home Manager dry-runs
        run: |
          nix build --dry-run '.#homeConfigurations."simon@linux".activationPackage'
          nix build --dry-run '.#homeConfigurations."simon@wsl".activationPackage'
